{% extends 'base.html' %}

{% block title %}TAUBABET - CONFIRMAR COMPRA{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="config-card1 p-5 text-white">
        <h1>PAGAR COM CARTÃO DE CRÉDITO</h1>

        <form method="POST" action="{{ url_for('pagar_com_cartao_credito') }}">
            <div class="mb-3">
                <label>Valor</label>
                <input type="number" class="form-control" placeholder="R$ 50,00" name="valor" required>
            </div>

            <div class="mb-3">
                <label>Número do cartão</label>
                <input type="text" class="form-control" maxlength="19" placeholder="0000 0000 0000 0000" name="numero-do-cartao" required>
            </div>

            <div class="mb-3">
                <label>Nome no cartão</label>
                <input type="text" class="form-control" name="nome-do-cartao" required>
            </div>

            <div class="row">
                <div class="col">
                    <label>Validade</label>
                    <input type="text" class="form-control" placeholder="MM/AA" name="validade" required>
                </div>

                <div class="col">
                    <label>CVV</label>
                    <input type="password" class="form-control" maxlength="4" name="cvv" required>
                </div>
            </div>

            <button class="btn btn-success mt-4 w-100">
                Pagar
            </button>
        </form>

        <br>

        <div class="text-center">
            <a href="{{ url_for('pagina_adicionar_saldo') }}">
                <button class=" btn btn-primary">Voltar</button>
            </a>
        </div>
    </div>
</div>


{% endblock %}
